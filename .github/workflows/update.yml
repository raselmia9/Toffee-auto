name: Toffee Playlist Auto Update

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর রান হবে
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে ফাইল কমিট ও পুশ করার অনুমতি দেয়

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Script to Generate M3U
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # লোকাল পরিবর্তনগুলো সাময়িকভাবে স্ট্যাশ করে রাখা
          git stash || true
          
          # রিমোট রিপোজিটরির সাথে লেটেস্ট চেঞ্জেস সিঙ্ক করে নেওয়া
          git pull --rebase origin main || git pull --rebase origin master
          
          # স্ট্যাশ করা পরিবর্তনগুলো আবার ফিরিয়ে আনা
          git stash pop || true
          
          # M3U ফাইলের পাশাপাশি লগইন স্ট্যাটাস ফাইলটিও গিটহাবে যুক্ত করা হলো
          git add Toffee_Auto_Update.m3u login_status.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist and login status [skip ci]" && git push)
