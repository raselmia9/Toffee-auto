name: Update Toffee Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর রান হবে
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে ফাইল কমিট ও পুশ করার অনুমতি দেয়

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Script to Generate M3U
        run: python Toffee_Auto_Update.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # রিমোট রিপোজিটরির সাথে লেটেস্ট চেঞ্জেস সিঙ্ক করে নেওয়া যাতে কনফ্লিক্ট না হয়
          git pull --rebase origin main || git pull --rebase origin master
          
          git add Toffee_Auto_Update.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Toffee M3U playlist [skip ci]" && git push)
