name: Toffee M3U Auto Update

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটো রান হবে (আপনার ইচ্ছামতো পরিবর্তন করতে পারেন)
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Python Script
        run: |
          python main.py

      - name: Commit and Push M3U Playlist
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          git add Toffee_Auto_Update.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Toffee M3U playlist [skip ci]"
          git push
